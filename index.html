<title>Лактатный дневник</title>
<style>
:root{--bg:#f4f4f1;--ink:#0b0b0b;--line:#d9d8d2;--surface:#fcfcfb;--muted:#7d7c77;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--ink:#fff;--line:#3a3a37;--surface:#1a1a19;--muted:#8f8e86;--accent:#3987e5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}
label.c{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
input[type=password]{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
button{font:inherit;padding:10px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:#e34948;font-size:14px;min-height:1.2em;margin:0}
</style></head><body>

const bytes=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
async function decryptAndShow(pw){
  const raw=bytes(BLOB), salt=raw.slice(0,16), iv=raw.slice(16,28), data=raw.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data));
  document.open(); document.write(html); document.close();
}
async function go(pw,remember){
  $("b").disabled=true; $("err").textContent="";
  try{
    await decryptAndShow(pw);

    $("b").disabled=false;

}
